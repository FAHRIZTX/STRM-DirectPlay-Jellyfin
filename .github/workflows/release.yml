name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.StrmDirectPlay.sln

      - name: Build
        run: dotnet build Jellyfin.Plugin.StrmDirectPlay.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Jellyfin.Plugin.StrmDirectPlay.sln --configuration Release --no-build --verbosity normal
        continue-on-error: true

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="manual-${GITHUB_RUN_NUMBER}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "zip_name=STRM-DirectPlay-Jellyfin_${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Prepare package
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          PLUGIN_NAME="Jellyfin.Plugin.StrmDirectPlay"
          OUTPUT_DIR="release/${PLUGIN_NAME}"

          mkdir -p "${OUTPUT_DIR}"

          cp "${PLUGIN_NAME}/bin/Release/net8.0/${PLUGIN_NAME}.dll" "${OUTPUT_DIR}/"
          cp README.md LICENSE CHANGELOG.md manifest.json "${OUTPUT_DIR}/"

          cd release
          zip -r "../${{ steps.version.outputs.zip_name }}" "${PLUGIN_NAME}"

      - name: Generate checksum
        id: checksum
        shell: bash
        run: |
          CHECKSUM=$(sha256sum "${{ steps.version.outputs.zip_name }}" | awk '{print $1}')
          echo "sha256=${CHECKSUM}" >> "$GITHUB_OUTPUT"
          echo "${CHECKSUM}  ${{ steps.version.outputs.zip_name }}" > "${{ steps.version.outputs.zip_name }}.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: STRM-DirectPlay-Jellyfin-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.version.outputs.zip_name }}
            ${{ steps.version.outputs.zip_name }}.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: STRM DirectPlay ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ## STRM DirectPlay ${{ github.ref_name }}

            ### Package
            - `${{ steps.version.outputs.zip_name }}`
            - SHA256: `${{ steps.checksum.outputs.sha256 }}`

            ### Install
            1. Download `${{ steps.version.outputs.zip_name }}`.
            2. Extract folder `Jellyfin.Plugin.StrmDirectPlay`.
            3. Copy to Jellyfin plugins directory.
            4. Restart Jellyfin.
          files: |
            ${{ steps.version.outputs.zip_name }}
            ${{ steps.version.outputs.zip_name }}.sha256
