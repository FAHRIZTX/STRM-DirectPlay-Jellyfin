name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.StrmDirectPlay.sln

      - name: Build
        run: dotnet build Jellyfin.Plugin.StrmDirectPlay.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Jellyfin.Plugin.StrmDirectPlay.sln --configuration Release --no-build --verbosity normal
        continue-on-error: true

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="manual-${GITHUB_RUN_NUMBER}"
          fi

          # Convert "1.2.3" to Jellyfin assembly-style "1.2.3.0"
          ASSEMBLY_VERSION="${VERSION}"
          if [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            ASSEMBLY_VERSION="${VERSION}.0"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "assembly_version=${ASSEMBLY_VERSION}" >> "$GITHUB_OUTPUT"
          echo "zip_name=STRM-DirectPlay-Jellyfin_${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Extract changelog for this version
        id: changelog
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          CHANGELOG=$(awk -v ver="${VERSION}" '
            BEGIN { in_section = 0 }
            /^##[[:space:]]+\[?v?/ {
              line = $0
              sub(/^##[[:space:]]+\[?v?/, "", line)
              sub(/\]?[[:space:]]*-?[[:space:]]*[0-9]{4}-[0-9]{2}-[0-9]{2}.*$/, "", line)
              gsub(/[[:space:]]+$/, "", line)
              if (line == ver) {
                in_section = 1
                next
              }
              if (in_section) {
                in_section = 0
              }
            }
            in_section { print }
            END { exit 0 }
          ' CHANGELOG.md)

          if [[ -z "${CHANGELOG// /}" ]]; then
            CHANGELOG="Release ${VERSION}"
          fi

          printf '%s\n' "${CHANGELOG}" > changelog.tmp
          echo "changelog_file=changelog.tmp" >> "$GITHUB_OUTPUT"

      - name: Prepare package
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          PLUGIN_NAME="Jellyfin.Plugin.StrmDirectPlay"
          OUTPUT_DIR="release/${PLUGIN_NAME}"

          mkdir -p "${OUTPUT_DIR}"

          cp "${PLUGIN_NAME}/bin/Release/net9.0/${PLUGIN_NAME}.dll" "${OUTPUT_DIR}/"
          cp README.md LICENSE CHANGELOG.md manifest.json "${OUTPUT_DIR}/"

          cd release
          zip -r "../${{ steps.version.outputs.zip_name }}" "${PLUGIN_NAME}"

      - name: Generate checksum
        id: checksum
        shell: bash
        run: |
          CHECKSUM=$(sha256sum "${{ steps.version.outputs.zip_name }}" | awk '{print $1}')
          echo "sha256=${CHECKSUM}" >> "$GITHUB_OUTPUT"
          echo "${CHECKSUM}  ${{ steps.version.outputs.zip_name }}" > "${{ steps.version.outputs.zip_name }}.sha256"

      - name: Update manifest.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.assembly_version }}"
          CHECKSUM="${{ steps.checksum.outputs.sha256 }}"
          ZIP_NAME="${{ steps.version.outputs.zip_name }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          REPO_URL="https://github.com/${{ github.repository }}"
          SOURCE_URL="${REPO_URL}/releases/download/${GITHUB_REF_NAME}/${ZIP_NAME}"

          # Prepend a new version entry to manifest.json (changelog filled in next step).
          # Remove an existing entry with the same version first so re-running
          # the release workflow does not duplicate manifest entries.
          jq --arg version   "${VERSION}" \
             --arg targetAbi "10.11.0.0" \
             --arg sourceUrl "${SOURCE_URL}" \
             --arg checksum  "${CHECKSUM}" \
             --arg timestamp "${TIMESTAMP}" \
             --arg changelog "" \
             '.versions = [{
                version:   $version,
                changelog: $changelog,
                targetAbi: $targetAbi,
                sourceUrl: $sourceUrl,
                checksum:  $checksum,
                timestamp: $timestamp
              }] + (.versions | map(select(.version != $version)))' \
             manifest.json > manifest.json.tmp

          mv manifest.json.tmp manifest.json

      - name: Inject changelog text into manifest.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail

          jq --rawfile cl changelog.tmp \
             '.versions[0].changelog = $cl' \
             manifest.json > manifest.json.tmp

          mv manifest.json.tmp manifest.json
          rm -f changelog.tmp

          echo "Final manifest.json:"
          cat manifest.json

      - name: Commit and push manifest.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          cp manifest.json /tmp/manifest.release.json

          # The workflow is triggered by a tag, so checkout is detached HEAD.
          # Do not push HEAD to the tag ref. Instead, apply the generated
          # manifest.json on the repository default branch and push that branch.
          git fetch origin "${DEFAULT_BRANCH}"
          git switch --create manifest-update "origin/${DEFAULT_BRANCH}"
          cp /tmp/manifest.release.json manifest.json

          git add manifest.json
          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
          else
            git commit -m "chore(release): update manifest.json for ${GITHUB_REF_NAME}"
            git push origin HEAD:"${DEFAULT_BRANCH}"
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: STRM-DirectPlay-Jellyfin-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.version.outputs.zip_name }}
            ${{ steps.version.outputs.zip_name }}.sha256
            manifest.json

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: STRM DirectPlay ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ## STRM DirectPlay ${{ github.ref_name }}

            ### Package
            - `${{ steps.version.outputs.zip_name }}`
            - SHA256: `${{ steps.checksum.outputs.sha256 }}`

            ### Install
            1. Download `${{ steps.version.outputs.zip_name }}`.
            2. Extract folder `Jellyfin.Plugin.StrmDirectPlay`.
            3. Copy to Jellyfin plugins directory.
            4. Restart Jellyfin.
          files: |
            ${{ steps.version.outputs.zip_name }}
            manifest.json
            ${{ steps.version.outputs.zip_name }}.sha256
